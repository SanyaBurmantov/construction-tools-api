name: CI

on:
  push:
    branches: [master, main, prod]
  pull_request:
    branches: [master, main, prod]

jobs:
  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          DB_PASSWORD: ci-validation-only
          ADMIN_TOKEN: ci-validation-only

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      # `npm run build` uses tsconfig.build.json, which excludes **/*spec.ts.
      # This checks the tests themselves: it is what catches a spec that
      # constructs a service with the wrong arguments and still passes because
      # Jest transpiles without type information.
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test -- --runInBand --silent
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
