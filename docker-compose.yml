services:
  db:
    image: postgres:15-alpine
    container_name: construction-tools-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: construction_tools
    ports:
      - "2222:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  back:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: construction-tools-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend:cached
      - /backend/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/construction_tools?schema=public
      # Service header only (runbook curl, CI). The admin *account* password is
      # ADMIN_PASSWORD, or the committed default admin / test-111.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-30}
      CART_TTL_DAYS: ${CART_TTL_DAYS:-90}
      LIST_TTL_DAYS: ${LIST_TTL_DAYS:-365}
      ADMIN_LOG_TTL_DAYS: ${ADMIN_LOG_TTL_DAYS:-180}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    # Migrations run here for the same reason they do in the production image:
    # the postgres volume outlives the container, so without this the schema
    # silently lags behind the code and every query hits a missing column.
    command: sh -c "npx prisma migrate deploy && npm run start:dev"

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Without this Docker builds the last stage (production), which ships only
      # .output and no node_modules — and `npm run dev` below then fails with
      # "sh: 1: nuxt: not found".
      target: development
    container_name: construction-tools-front
    restart: unless-stopped
    volumes:
      - ./frontend:/frontend:cached
      - /frontend/node_modules
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      NODE_ENV: development
      API_BASE_SERVER: http://back:8000
      NUXT_PUBLIC_API_BASE: /api
      # `nuxt dev` binds to localhost by default; inside a container that makes
      # the published port unreachable from the host.
      HOST: 0.0.0.0
      PORT: 3000
    command: npm run dev

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
